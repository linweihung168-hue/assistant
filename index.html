<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="語音助理">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>語音助理</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
</head>
<body>
<div id="banner" class="banner" hidden></div>

<div class="app">
  <header class="top">
    <div class="hello">
      <div class="chip"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span id="clock"></span></div>
      <h1 id="hi">嗨！</h1>
    </div>
    <div class="tools">
      <button class="iconbtn" id="helpBtn" aria-label="可以說的句型"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.3-2.5 3.9"/><path d="M12 17.2h.01"/></svg></button>
      <button class="iconbtn" id="setBtn" aria-label="設定"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <div class="panes">
    <section class="pane" id="paneChat" data-pane="chat">
      <div class="mic-card" id="micCard" data-state="idle">
        <div class="ring r1"><div class="ring r2">
          <button class="mic" id="micBtn" aria-label="開始說話"><svg aria-hidden="true" width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button>
        </div></div>
        <div class="status" id="status" role="status" aria-live="polite">點麥克風說話</div>
      </div>
      <div class="chat" id="chat" aria-label="對話紀錄"></div>
      <form class="typebar" id="typeForm" autocomplete="off">
        <label for="typed" class="sr">打字輸入</label>
        <input id="typed" type="text" enterkeyhint="send" placeholder="不方便說話？打字也可以⋯">
        <button type="submit" class="send" aria-label="送出"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
      </form>
    </section>

    <section class="pane card yellow" id="paneRem" data-pane="rem">
      <div class="card-h"><h2>提醒</h2><span class="count" id="remCount">0</span></div>
      <div id="remList" class="list"></div>
    </section>

    <section class="pane card mint" id="paneNote" data-pane="note">
      <div class="card-h"><h2>記事</h2><span class="count" id="noteCount">0</span></div>
      <div id="noteList" class="list"></div>
    </section>
  </div>
  <footer class="foot" id="foot"></footer>
</div>

<nav class="tabbar" aria-label="切換頁面">
  <button class="tab on" data-tab="chat"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>助理</span></button>
  <button class="tab" data-tab="rem"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span>提醒</span><i class="dot" id="remDot" hidden></i></button>
  <button class="tab" data-tab="note"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg><span>記事</span></button>
</nav>

<div class="overlay start" id="start">
  <button class="start-btn" id="startBtn"><span class="start-hi" id="startHi">嗨！</span><span class="start-sub">點一下開始</span></button>
</div>

<div class="overlay" id="remModal" hidden>
  <div class="dialog" role="dialog" aria-labelledby="remTitle">
    <div class="bell"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></div>
    <div class="rem-time" id="remTime"></div>
    <h2 id="remTitle"></h2>
    <div class="rem-hint" id="remHint"></div>
    <div class="rem-btns">
      <button class="btn primary" id="ackBtn">知道了</button>
      <button class="btn soft" id="snoozeBtn">5 分鐘後再提醒</button>
    </div>
  </div>
</div>

<div class="overlay" id="helpModal" hidden>
  <div class="panel" role="dialog" aria-labelledby="helpTitle">
    <div class="panel-h"><h2 id="helpTitle">可以這樣說</h2><button class="iconbtn" data-close aria-label="關閉">✕</button></div>
    <p class="muted">點一下句子就會直接問。</p>
    <div id="helpBody"></div>
  </div>
</div>

<div class="overlay" id="setModal" hidden>
  <div class="panel" role="dialog" aria-labelledby="setTitle">
    <div class="panel-h"><h2 id="setTitle">設定</h2><button class="iconbtn" data-close aria-label="關閉">✕</button></div>

    <h3>個人</h3>
    <div class="row"><label for="sName">你的名字</label><input id="sName" type="text"></div>

    <h3>聲音</h3>
    <div class="row col"><label for="sVoice">語音</label><select id="sVoice"></select></div>
    <div class="row"><label for="sRate">說話速度 <span id="rateVal"></span></label><input id="sRate" type="range" min="0.7" max="1.5" step="0.05"></div>
    <div class="row"><span></span><button class="btn soft small" id="testVoice">試聽</button></div>
    <p class="muted">iPhone 開靜音時不會出聲音。</p>

    <h3>聽</h3>
    <div class="row"><label for="sSilence">說完停頓多久算講完</label>
      <select id="sSilence"><option value="1">1 秒</option><option value="1.5">1.5 秒</option><option value="2">2 秒</option><option value="3">3 秒</option></select></div>

    <h3>提醒</h3>
    <div class="row"><label for="sRepeat">沒按「知道了」時，每隔幾分鐘再念</label>
      <select id="sRepeat"><option value="1">1 分鐘</option><option value="2">2 分鐘</option><option value="3">3 分鐘</option><option value="5">5 分鐘</option></select></div>
    <div class="row"><label for="sSnooze">「再提醒」要等多久</label>
      <select id="sSnooze"><option value="5">5 分鐘</option><option value="10">10 分鐘</option><option value="15">15 分鐘</option><option value="30">30 分鐘</option></select></div>
    <div class="row"><label for="sChime">提醒前先響一聲</label><input id="sChime" type="checkbox" class="switch"></div>
    <div class="row"><label for="sIos">同時加到 iPhone「提醒事項」（鎖屏也會響，需要先設定捷徑）</label><input id="sIos" type="checkbox" class="switch"></div>
    <p class="muted">助理開著時，提醒時間到會跳出視窗並念出來。App 關掉或鎖屏時要靠 iPhone「提醒事項」才會響。</p>

    <h3>資料</h3>
    <p class="muted">Word 班表（.docx）或 Excel 資料表（.xlsx）。資料只存在這支手機裡。</p>
    <div class="row wrapbtns">
      <label class="btn primary small filebtn">匯入檔案<input type="file" id="fileInput" accept=".docx,.xlsx,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple hidden></label>
    </div>
    <div id="dataList" class="dlist"></div>

    <h3>綽號</h3>
    <p class="muted">例如「阿弘」→「偉弘」，問班表時說綽號也找得到人。</p>
    <div class="row nick"><input id="nkA" type="text" placeholder="綽號" aria-label="綽號"><span>→</span><input id="nkB" type="text" placeholder="名字" aria-label="名字"><button class="btn soft small" id="nkAdd">加入</button></div>
    <div id="nickList" class="dlist"></div>

    <h3>查不到的問題 <span class="count" id="unCount">0</span></h3>
    <div id="unList" class="dlist"></div>
    <div class="row"><span></span><button class="btn soft small" id="unClear">清空</button></div>

    <h3>備份</h3>
    <p class="muted">換手機或清除 Safari 資料前，先匯出備份。</p>
    <div class="row wrapbtns">
      <button class="btn soft small" id="bkOut">匯出備份</button>
      <label class="btn soft small filebtn">匯入備份<input type="file" id="bkIn" accept=".json,application/json" hidden></label>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="brain.js"></script>
<script src="app.js"></script>
</body>
</html>
